name: Deploy VERA manually

# No push/pull_request trigger: merging code must never deploy it automatically.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character main commit SHA approved for this release
        required: true
        type: string
      confirmation:
        description: Type DEPLOY VERA after paired-backend readiness and backup checks
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vera-azure-deployment
  cancel-in-progress: false

jobs:
  authorize:
    name: Validate manual release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main, an exact SHA, and explicit confirmation
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$EVENT" = workflow_dispatch
          test "$REF" = refs/heads/main
          test "$REQUESTED_SHA" = "$SHA"
          test "$CONFIRMATION" = 'DEPLOY VERA'

  checks:
    name: Release checks
    needs: authorize
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy approved VERA commit
    needs: [authorize, checks]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.commit_sha == github.sha && inputs.confirmation == 'DEPLOY VERA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Package tracked source without runtime data
        run: |
          mkdir -p "$RUNNER_TEMP/vera-deploy"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/vera-deploy" --exclude=data --exclude=outcomes --exclude=tests --exclude=.github --exclude=.env
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0DA17A2F9D174AD4947B0A1B484681E6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_25B1E96866D54F6FA30D89F249CD989C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A2E7508480BF4352AA1D27C08A41A6D4 }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: vera-cloud-app
          package: ${{ runner.temp }}/vera-deploy
